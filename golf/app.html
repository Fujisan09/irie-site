<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打席を予約する（Smart Hello アプリ）｜GOLF STUDIO IRiE</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0B0A">
<style>
:root{--bg:#0B0B0A;--white:#F5F3EC;--muted:#B5B2A5;--dim:#7F7D74;--gold:#CFA94E;--gold-light:#F0D98A;--line:rgba(245,243,236,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(70% 50% at 85% 0%,rgba(17,122,63,.26),transparent 62%),var(--bg);color:var(--white);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 20px;line-height:1.8}
.card{width:100%;max-width:440px}
h1{font-size:24px;line-height:1.4;margin:22px 0 8px}
p{margin:0 0 20px;color:var(--muted);font-size:14.5px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;margin:10px 0;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px;border:1px solid var(--line);color:var(--white);background:rgba(245,243,236,.04)}
.btn.primary{background:linear-gradient(180deg,#E6CA72,#CFA94E);color:#1A1405;border-color:transparent}
.fine{font-size:12.5px;color:var(--dim);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.fine a{color:var(--muted)}
svg{height:46px;width:auto}
</style>
</head>
<body>
<div class="card">
  <a href="./" aria-label="GOLF STUDIO IRiE トップへ"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GOLF STUDIO IRiE"><defs><clipPath id="c"><circle cx="50" cy="50" r="44"/></clipPath><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#A8822A"/><stop offset=".55" stop-color="#CFA94E"/><stop offset="1" stop-color="#F0D98A"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C9A4F"/><stop offset="1" stop-color="#0A4D27"/></linearGradient></defs><g clip-path="url(#c)"><circle cx="50" cy="50" r="44" fill="#0B0B0A"/><polygon points="100,0 100,100 0,100" fill="url(#gr)"/><line x1="8" y1="92" x2="92" y2="8" stroke="url(#g)" stroke-width="11"/></g><circle cx="50" cy="50" r="46" fill="none" stroke="url(#g)" stroke-width="3"/><circle cx="71" cy="29" r="8.5" fill="#F5F3EC"/></svg></a>
  <h1>打席の予約は、会員専用アプリ「Smart Hello」から。</h1>
  <p>予約・変更・キャンセルは24時間いつでも。アプリが入っていれば、そのまま開いてログインしてください。まだの方は下から入手できます。</p>
  <a class="btn primary" id="ios" href="https://apps.apple.com/jp/app/id1582424100">App Store で開く（iPhone）</a>
  <a class="btn" id="android" href="https://play.google.com/store/search?q=Smart%20Hello&c=apps">Google Play で開く（Android）</a>
  <p class="fine">入会がまだの方は <a href="https://golfstudio-irie.admission.smarthello.jp/55492597bd734814a98eed24f4998b82/simulation">Web入会手続き</a> へ（来店不要・クレジットカード決済）。<br>アプリのログインでお困りのときは、LINEまたはお電話（03-6824-6199／9:00〜19:00）へどうぞ。</p>
</div>
<script>
(function(){
  var ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var android=/Android/.test(ua);
  if(ios){document.getElementById('android').style.display='none';}
  else if(android){document.getElementById('ios').style.display='none';var a=document.getElementById('android');a.className='btn primary';}
})();
</script>
</body>
</html>
